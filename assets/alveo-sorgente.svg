<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 144" width="144" height="144" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Alveo — Sorgente</title>
  <desc id="d">Logomark modulare 5×5: un canale vuoto attraversa il pieno da sponda a sponda. I moduli entrano in scala lungo la diagonale della corrente, da monte a valle.</desc>
  <style>
    .m {
      fill: #14110F;
      transform-box: fill-box;
      transform-origin: center;
      animation: asm 3.6s ease-in-out infinite;
    }
    @keyframes asm {
      0%, 4%   { opacity: 0; transform: scale(.35); }
      18%, 84% { opacity: 1; transform: scale(1); }
      100%     { opacity: 0; transform: scale(.35); }
    }
    @media (prefers-reduced-motion: reduce) {
      .m { animation: none; opacity: 1; transform: none; }
    }
  </style>

  <!-- riga 0 -->
  <rect class="m" x="120" y="0"   width="24" height="24" style="animation-delay:0s"/>
  <rect class="m" x="90"  y="0"   width="24" height="24" style="animation-delay:.15s"/>
  <rect class="m" x="60"  y="0"   width="24" height="24" style="animation-delay:.3s"/>
  <rect class="m" x="30"  y="0"   width="24" height="24" style="animation-delay:.45s"/>
  <rect class="m" x="0"   y="0"   width="24" height="24" style="animation-delay:.6s"/>
  <!-- riga 1 -->
  <rect class="m" x="30"  y="30"  width="24" height="24" style="animation-delay:.6s"/>
  <rect class="m" x="0"   y="30"  width="24" height="24" style="animation-delay:.75s"/>
  <!-- riga 2 -->
  <rect class="m" x="120" y="60"  width="24" height="24" style="animation-delay:.3s"/>
  <rect class="m" x="90"  y="60"  width="24" height="24" style="animation-delay:.45s"/>
  <rect class="m" x="0"   y="60"  width="24" height="24" style="animation-delay:.9s"/>
  <!-- riga 3 -->
  <rect class="m" x="120" y="90"  width="24" height="24" style="animation-delay:.45s"/>
  <rect class="m" x="90"  y="90"  width="24" height="24" style="animation-delay:.6s"/>
  <rect class="m" x="60"  y="90"  width="24" height="24" style="animation-delay:.75s"/>
  <!-- riga 4 -->
  <rect class="m" x="120" y="120" width="24" height="24" style="animation-delay:.6s"/>
  <rect class="m" x="90"  y="120" width="24" height="24" style="animation-delay:.75s"/>
  <rect class="m" x="60"  y="120" width="24" height="24" style="animation-delay:.9s"/>
  <rect class="m" x="30"  y="120" width="24" height="24" style="animation-delay:1.05s"/>
  <rect class="m" x="0"   y="120" width="24" height="24" style="animation-delay:1.2s"/>
</svg>
